<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 669 555" width="669" height="555">
  <defs>
    <pattern id="haz" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="30" height="30" fill="#f75202"/>
      <rect width="14" height="30" fill="#0d0d0e"/>
    </pattern>
    <clipPath id="frontGlass"><polygon points="204,264 262,104 272,96 355,88 355,264"/></clipPath>
    <clipPath id="sideGlass"><polygon points="398,86 452,83 480,208 470,228 398,262"/></clipPath>
  </defs>

  <g id="cab" stroke="#0d0d0e" stroke-width="26" stroke-linejoin="miter" stroke-miterlimit="2.5" paint-order="stroke">
    <!-- cab body -->
    <polygon fill="#2b2b2d" points="247,62 478,46 486,52 498,72 522,215 521,262 530,268 545,300 545,420 490,480 170,480 152,462 154,509 112,509 100,492 72,470 58,446 58,420 72,400 96,390 120,386 132,358 168,236 200,150 232,84"/>
    <!-- counterweight / engine body -->
    <polygon id="body" fill="#f75202" points="165,465 376,465 384,452 392,420 404,388 422,352 452,318 492,292 540,274 574,268 596,274 606,290 612,320 618,370 621,404 600,410 565,422 552,436 500,508 174,509 167,496"/>
    <!-- rear grille panel -->
    <polygon fill="#2b2b2d" points="522,508 553,462 570,438 596,426 628,420 630,430 628,465 622,495 612,507"/>
  </g>

  <!-- windows -->
  <g fill="#d1d1d1" stroke="#0d0d0e" stroke-width="5" stroke-linejoin="miter">
    <polygon points="204,264 262,104 272,96 355,88 355,264"/>
    <polygon points="398,86 452,83 480,208 470,228 398,262"/>
    <polygon points="210,292 324,292 296,431 178,431"/>
  </g>
  <!-- glare -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-linecap="butt">
    <g clip-path="url(#frontGlass)"><line x1="330" y1="80" x2="250" y2="280" stroke-width="14"/><line x1="356" y1="80" x2="276" y2="280" stroke-width="5"/></g>
    <g clip-path="url(#sideGlass)"><line x1="452" y1="70" x2="400" y2="200" stroke-width="10"/></g>
  </g>
  <!-- guard bars over lower glass -->
  <g stroke="#0d0d0e" stroke-width="8">
    <line x1="248" y1="292" x2="220" y2="431"/>
    <line x1="286" y1="292" x2="258" y2="431"/>
    <line x1="194" y1="360" x2="310" y2="360"/>
  </g>

  <!-- panel seams + rivets -->
  <polyline points="252,80 476,63" fill="none" stroke="#424245" stroke-width="4"/>
  <g fill="#55555a">
    <circle cx="377" cy="110" r="4"/><circle cx="377" cy="180" r="4"/><circle cx="377" cy="250" r="4"/>
    <circle cx="170" cy="470" r="0"/>
  </g>

  <!-- body shading + highlight -->
  <polygon fill="#c75300" points="588,282 600,295 606,325 612,370 614,398 592,404 590,370 586,320"/>
  <polyline points="380,452 388,422 400,392 417,358 446,325 488,300 538,283 572,277" fill="none" stroke="#ff9a4d" stroke-width="4" stroke-opacity="0.85"/>

  <!-- engine louvers -->
  <g stroke="#0d0d0e" stroke-width="8">
    <line x1="452" y1="440" x2="500" y2="392"/>
    <line x1="474" y1="446" x2="522" y2="398"/>
    <line x1="496" y1="452" x2="544" y2="404"/>
  </g>

  <!-- hazard band -->
  <polygon fill="url(#haz)" points="170,488 514,488 500,508 174,509"/>
  <line x1="170" y1="488" x2="514" y2="488" stroke="#0d0d0e" stroke-width="6"/>

  <!-- bolts -->
  <g fill="#0d0d0e"><circle cx="200" cy="476" r="5"/><circle cx="280" cy="476" r="5"/><circle cx="360" cy="476" r="5"/></g>

  <!-- grille slats -->
  <g stroke="#4a4a4f" stroke-width="5">
    <line x1="560" y1="500" x2="596" y2="440"/>
    <line x1="580" y1="502" x2="612" y2="432"/>
    <line x1="600" y1="502" x2="622" y2="440"/>
  </g>

  <!-- scuffs -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round">
    <line x1="230" y1="470" x2="252" y2="466"/>
    <line x1="430" y1="470" x2="446" y2="458"/>
    <line x1="560" y1="300" x2="574" y2="296"/>
  </g>

  <!-- work light -->
  <g id="light">
    <circle cx="95" cy="428" r="24" fill="#0d0d0e"/>
    <circle cx="95" cy="428" r="14" fill="#e8eef1"/>
    <path d="M81 428H109M95 414V442" stroke="#0d0d0e" stroke-width="4"/>
  </g>
</svg>
